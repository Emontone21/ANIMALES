<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="light dark" />
    <title>%WEB_TITLE%</title>
    <!-- La misma descripción que la vista previa genérica del link (t.compartir.vistaPrevia). -->
    <meta name="description" content="Animales perdidos y encontrados en Montevideo. Si viste uno, avisá: así vuelve a casa." />
    <!--
      Conexiones abiertas de antemano: Supabase (API con CORS y fotos de Storage sin CORS,
      que van por conexiones distintas) y OpenFreeMap (estilo, teselas y letras del mapa).
      La URL de Supabase es la de producción (EXPO_PUBLIC_SUPABASE_URL): si cambia el
      proyecto, cambiala acá también.
    -->
    <link rel="preconnect" href="https://bwqvuttuodwypwxckxgf.supabase.co" crossorigin />
    <link rel="preconnect" href="https://bwqvuttuodwypwxckxgf.supabase.co" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <!-- Instalar la app (ver docs/ARQUITECTURA.md). Íconos: scripts/iconos-web.py. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="theme-color" content="#F6F6F2" media="(prefers-color-scheme: light)" /><!-- claro.fondo -->
    <meta name="theme-color" content="#121410" media="(prefers-color-scheme: dark)" /><!-- oscuro.fondo -->
    <!-- beforeinstallprompt puede llegar antes que la app: se guarda acá (src/features/instalar/). -->
    <script>
      (function () {
        var estado = (window.__instalar = { aviso: null, instalada: false });
        function avisar() {
          window.dispatchEvent(new Event('instalar-cambio'));
        }
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          estado.aviso = e;
          avisar();
        });
        window.addEventListener('appinstalled', function () {
          estado.aviso = null;
          estado.instalada = true;
          avisar();
        });
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          });
        }
      })();
    </script>
    <!--
      Primer pintado según la apariencia elegida en Perfil (clave "encontrados-apariencia",
      ver src/features/apariencia/preferencia.ts): data-esquema elige los colores de la
      pantalla de carga y color-scheme los del navegador. La app aplica la paleta de
      src/constants/tema.ts apenas monta.
    -->
    <script>
      try {
        var guardada = JSON.parse(localStorage.getItem('encontrados-apariencia') || 'null');
        var preferencia = guardada && guardada.state && guardada.state.preferencia;
        if (preferencia === 'claro' || preferencia === 'oscuro') {
          document.documentElement.setAttribute('data-esquema', preferencia);
          document.documentElement.style.colorScheme = preferencia === 'claro' ? 'light' : 'dark';
        }
      } catch (e) {}
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html {
        color-scheme: light dark;
      }
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      Fuentes de la app (src/constants/tema.ts, FAMILIAS), copiadas a public/fuentes por
      scripts/copiar-a-public.js. Arrancan apagadas (media="not all": no se baja nada) y la
      app las activa después de las fotos que se ven al abrir (src/lib/fuentesWeb.ts). Con
      font-display: swap nada las espera: la app se ve con la fuente del sistema y cambia
      cuando llegan.
    -->
    <style id="encontrados-fuentes" media="not all">
      @font-face {
        font-family: 'Fredoka_600SemiBold';
        src: url('/fuentes/Fredoka_600SemiBold.ttf') format('truetype');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'Figtree_400Regular';
        src: url('/fuentes/Figtree_400Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Figtree_600SemiBold';
        src: url('/fuentes/Figtree_600SemiBold.ttf') format('truetype');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'Figtree_700Bold';
        src: url('/fuentes/Figtree_700Bold.ttf') format('truetype');
        font-weight: 700;
        font-display: swap;
      }
    </style>
    <!--
      Pantalla de carga (#carga): se ve desde el primer instante, sin esperar al JS, y la
      app la saca al montar (src/app/_layout.tsx). Es la única excepción a las reglas de
      tema.ts y es-UY.ts (AGENTS.md, "Pantalla de carga"): cada color es un token de la
      paleta, el logo tiene las formas de assets/marca/ y __tests__/indexHtml.test.ts
      comprueba que coincidan.
    -->
    <style id="encontrados-carga">
      :root {
        --carga-fondo: #F6F6F2; /* claro.fondo */
        --carga-texto: #151613; /* claro.texto */
        --carga-primario: #556B2F; /* claro.primario */
        --carga-borde: #E2E3DA; /* claro.borde */
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-esquema='claro']) {
          --carga-fondo: #121410; /* oscuro.fondo */
          --carga-texto: #EDEEE6; /* oscuro.texto */
          --carga-primario: #8FA357; /* oscuro.primario */
          --carga-borde: #2E3128; /* oscuro.borde */
        }
      }
      :root[data-esquema='oscuro'] {
        --carga-fondo: #121410; /* oscuro.fondo */
        --carga-texto: #EDEEE6; /* oscuro.texto */
        --carga-primario: #8FA357; /* oscuro.primario */
        --carga-borde: #2E3128; /* oscuro.borde */
      }
      /* Sin destello blanco ni negro: el fondo de la app desde el primer pintado. */
      html,
      body {
        margin: 0;
        background-color: var(--carga-fondo);
      }
      #carga {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background-color: var(--carga-fondo);
        color: var(--carga-texto);
      }
      /* El logo, a 180 de ancho: las formas de assets/marca/spot-logo.svg (y de
         spot-logo-oscuro.svg, que son las mismas), con la chapita en primario y la argolla
         y la palabra en texto. En cada esquema son los colores de su archivo. */
      .carga-logo {
        display: block;
        width: 180px;
        height: auto;
        aspect-ratio: 274 / 107;
      }
      .carga-logo-chapita {
        fill: var(--carga-primario);
      }
      .carga-logo-argolla {
        stroke: var(--carga-texto);
      }
      .carga-logo-palabra {
        fill: var(--carga-texto);
      }
      .carga-indicador {
        width: 28px;
        height: 28px;
        box-sizing: border-box;
        border: 3px solid var(--carga-borde);
        border-top-color: var(--carga-primario);
        border-radius: 50%;
        animation: carga-giro 0.9s linear infinite;
      }
      @keyframes carga-giro {
        to {
          transform: rotate(360deg);
        }
      }
      .carga-texto {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
    <style id="encontrados-web">
      /* Sin "tirar para recargar" en Chrome de Android: tirar hacia abajo una lista que
         ya está arriba recargaba la app y se perdía, por ejemplo, un Publicar a medias. */
      html,
      body {
        overscroll-behavior-y: none;
      }
      /* Cursor de mano en todo lo que se toca. */
      [role='button']:not([aria-disabled='true']),
      [role='link'],
      [role='tab'],
      [role='radio'],
      [role='switch'],
      [role='checkbox'],
      a {
        cursor: pointer;
      }
      /* Foco visible al navegar con teclado: anillo de 2 px en el primario, separado 2 px.
         La app define --color-foco con la paleta activa. */
      :focus-visible {
        outline: 2px solid var(--color-foco, currentColor) !important;
        outline-offset: 2px !important;
      }
      /* Los campos de texto marcan el foco con su borde de 2 px (CampoTexto). */
      input:focus-visible,
      textarea:focus-visible {
        outline: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
